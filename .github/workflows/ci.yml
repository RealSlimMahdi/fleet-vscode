name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Server discovery branches on platform, so the units run on all three.
  unit:
    name: Unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run format:check

      - run: npm run test:unit

  # Ubuntu only: VS Code needs a display server, and the client contract is
  # already covered at the protocol boundary in fleet-cdisc.
  integration:
    name: Extension Host (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Extension Host activation test
        run: xvfb-run -a npm run test:integration

  # One inspectable artifact per pull request, checked before it is uploaded.
  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Package and verify the VSIX
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: fleet-vscode-vsix
          path: "*.vsix"
          if-no-files-found: error
